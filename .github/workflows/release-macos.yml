name: Release macOS app

# Builds the two PyInstaller sidecars (localist-backend, localist-mcp) and
# the Tauri .app/.dmg, then attaches the DMG to a GitHub Release. Runs on
# an Apple Silicon runner to match the arm64-only sidecar builds — see
# backend/packaging/README.md and localist-ui/src-tauri/README.md for what
# this automates locally.
#
# Unsigned build (no Apple Developer ID cert available) — see README.md's
# "Native macOS app" section for the Gatekeeper workaround end users need.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the draft release and upload the DMG

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build PyInstaller sidecars (base + [ocr])
        working-directory: backend
        # [ocr] is for localist-mcp's ocr_extract (Apple Vision + pypdfium2 +
        # Pillow); localist-backend.spec excludes those modules explicitly.
        # See backend/packaging/README.md.
        run: |
          python3 -m venv .venv-packaging
          source .venv-packaging/bin/activate
          pip install -e ".[dev,packaging,ocr]"
          cd packaging
          pyinstaller -y localist-backend.spec
          pyinstaller -y localist-mcp.spec

      - name: Check OCR bundling
        # A missing [ocr] install or a lost hiddenimport otherwise still
        # builds and starts fine, and only fails at the first image upload.
        run: |
          for m in Vision objc pypdfium2 pypdfium2_raw PIL; do
            test -d "backend/packaging/dist/localist-mcp/_internal/$m" \
              || { echo "::error::localist-mcp is missing OCR module $m"; exit 1; }
          done
          for m in Vision pypdfium2 PIL; do
            test ! -e "backend/packaging/dist/localist-backend/_internal/$m" \
              || { echo "::error::localist-backend unexpectedly bundles $m"; exit 1; }
          done

      - name: Smoke-test sidecars
        run: |
          backend/packaging/dist/localist-backend/localist-backend &
          BPID=$!
          sleep 6
          kill -0 $BPID
          kill $BPID
          backend/packaging/dist/localist-mcp/localist-mcp &
          MPID=$!
          sleep 6
          kill -0 $MPID
          kill $MPID

      - name: Install frontend dependencies
        working-directory: localist-ui
        run: npm ci

      - name: Build Tauri app (.app + .dmg)
        working-directory: localist-ui
        run: npm run tauri:build

      - name: Re-sign .app and rebuild DMG
        # Tauri's bundler ad-hoc-signs Localist.app before bundle.resources
        # (the sidecar folders) are copied in, which invalidates the
        # signature's resource seal (`codesign --verify` fails: "code has
        # no resources but signature indicates they must be present").
        # Confirmed live: a DMG built with that broken signature produces
        # macOS's "is damaged and can't be opened" error on a real
        # quarantined download — not the normal, xattr-cr-fixable
        # "unidentified developer" Gatekeeper gate. Re-signing ad-hoc
        # after resources are in place, then rebuilding the DMG from the
        # corrected .app, fixes this (verified: codesign --verify passes,
        # and the fix survives a simulated quarantined copy).
        run: |
          APP=$(find localist-ui/src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          DMG=$(find localist-ui/src-tauri/target/release/bundle/dmg -name "*.dmg" -maxdepth 1 | head -1)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          rm -f "$DMG"
          # hdiutil intermittently fails with "Resource busy" on GitHub's
          # macOS runners (a stale mount from Tauri's own DMG step, or
          # Spotlight/XProtect still scanning the fresh .app) — seen on the
          # first v0.1.1 run (2026-10-17). Detach any leftover
          # "Localist" volumes and retry with backoff instead of failing.
          for attempt in 1 2 3 4 5; do
            for vol in /Volumes/Localist*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            if hdiutil create -volname "Localist" -srcfolder "$APP" -ov -format UDZO "$DMG"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::hdiutil create failed after $attempt attempts"
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(find localist-ui/src-tauri/target/release/bundle/dmg -name "*.dmg" -maxdepth 1 | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Localist-macos-dmg
          path: ${{ steps.dmg.outputs.path }}

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
          body: |
            Unsigned build — no Apple Developer ID certificate is used for this project.
            After downloading and moving the app to Applications, run this once from Terminal:

            ```
            xattr -cr /Applications/Localist.app
            ```

            Then launch normally. Right-click → Open does **not** bypass this on current macOS —
            it will still say "is damaged and can't be opened"; `xattr -cr` is the actual fix.

            See the repo README's "Native macOS app" section for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
